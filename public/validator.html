<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validator Dashboard - Obius</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #fafafa;
            --text-primary: #000000;
            --text-secondary: #666666;
            --border-primary: #f0f0f0;
            --border-secondary: #e0e0e0;
            --accent: #00bcd4;
            --success: #00c851;
            --error: #ff5252;
            --warning: #ff9800;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-primary);
            padding: 1.5rem 0;
            margin-bottom: 2rem;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .debug-panel {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            border-left: 4px solid #007bff;
        }

        .debug-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .debug-btn {
            padding: 0.5rem 1rem;
            background: white;
            border: 1px solid var(--border-secondary);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .debug-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        #debug-output {
            background: white;
            padding: 1rem;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.875rem;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--border-secondary);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .stats-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            padding: 1.5rem;
        }

        .stat-item {
            margin-bottom: 1.5rem;
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--accent);
        }

        .main-content {
            background: var(--bg-primary);
            border: 1px solid var(--border-primary);
            border-radius: 8px;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-primary);
            padding: 0 1.5rem;
        }

        .tab {
            padding: 1rem 1.5rem;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab-content {
            padding: 1.5rem;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .task-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-secondary);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.2s;
        }

        .task-card:hover {
            border-color: var(--accent);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .task-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .task-meta {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .reward-badge {
            padding: 0.5rem 1rem;
            background: rgba(0, 200, 81, 0.1);
            border: 1px solid var(--success);
            border-radius: 6px;
            font-weight: 600;
            color: var(--success);
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .status-badge.pass {
            background: rgba(0, 200, 81, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .status-badge.fail {
            background: rgba(255, 82, 82, 0.1);
            color: var(--error);
            border: 1px solid var(--error);
        }

        .status-badge.pending {
            background: rgba(255, 152, 0, 0.1);
            color: var(--warning);
            border: 1px solid var(--warning);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: 1px solid var(--border-secondary);
            background: var(--accent);
            color: white;
            font-size: 0.875rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover:not(:disabled) {
            background: #00acc1;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--text-secondary);
        }

        .status-message {
            padding: 1rem;
            border-radius: 6px;
            margin: 1rem 0;
        }

        .status-success {
            background: rgba(0, 200, 81, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .status-error {
            background: rgba(255, 82, 82, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
        }

        .back-link {
            display: inline-block;
            padding: 0.5rem 1rem;
            color: var(--text-secondary);
            text-decoration: none;
            border: 1px solid var(--border-secondary);
            border-radius: 6px;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .back-link:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 2rem;
            max-width: 700px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            margin: 2rem;
        }

        .history-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border-secondary);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="logo">Obius Validator</div>
            <div>
                <a href="/catalog.html" class="back-link">← Back to Catalog</a>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- DEBUG PANEL -->
        <div class="debug-panel">
            <h3 style="margin-bottom: 1rem; color: #007bff;">Debug Panel</h3>
            <div class="debug-actions">
                <button class="debug-btn" onclick="debugAuth()">Check Auth</button>
                <button class="debug-btn" onclick="testAPI()">Test API</button>
                <button class="debug-btn" onclick="testValidatorEndpoint()">Test /validators/me</button>
                <button class="debug-btn" onclick="testTasksEndpoint()">Test Tasks</button>
                <button class="debug-btn" onclick="initializeValidator()">Initialize Validator</button>
                <button class="debug-btn" onclick="clearDebug()">Clear</button>
            </div>
            <div id="debug-output">Click buttons to debug...</div>
        </div>

        <div class="dashboard-grid">
            <div class="stats-panel">
                <h3 style="margin-bottom: 1.5rem;">Validator Stats</h3>
                <div class="stat-item">
                    <div class="stat-label">Total Validations</div>
                    <div class="stat-value" id="total-validations">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Consensus Rate</div>
                    <div class="stat-value" id="consensus-rate">0%</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Total Earned</div>
                    <div class="stat-value" id="total-earned">$0.00</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Current Balance</div>
                    <div class="stat-value" id="current-balance">$0.00</div>
                </div>
            </div>

            <div class="main-content">
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('tasks')">Available Tasks</button>
                    <button class="tab" onclick="switchTab('history')">My History</button>
                </div>

                <div class="tab-content active" id="tasks-tab">
                    <div id="tasks-container">
                        <div class="loading">Loading validation tasks...</div>
                    </div>
                </div>

                <div class="tab-content" id="history-tab">
                    <div id="history-container">
                        <div class="loading">Loading history...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Validation Modal -->
    <div id="validation-modal" class="modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem;">
                <h3>Submit Validation</h3>
                <button onclick="closeModal()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
            </div>
            
            <form id="validation-form">
                <input type="hidden" id="task-id">
                
                <div style="background: var(--bg-secondary); padding: 1rem; border-radius: 6px; margin-bottom: 1.5rem;">
                    <div>Package: <strong id="modal-package-name"></strong></div>
                    <div>Type: <strong id="modal-validation-type"></strong></div>
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Result</label>
                    <select id="validation-result" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-secondary); border-radius: 6px;">
                        <option value="">Select result</option>
                        <option value="pass">✓ Pass</option>
                        <option value="fail">✗ Fail</option>
                    </select>
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Confidence (0-100%)</label>
                    <input type="range" id="confidence-score" min="0" max="100" value="80" style="width: 100%;">
                    <div style="text-align: center; color: var(--accent); font-weight: 600;" id="confidence-display">80%</div>
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Notes</label>
                    <textarea id="validation-notes" required style="width: 100%; min-height: 100px; padding: 0.75rem; border: 1px solid var(--border-secondary); border-radius: 6px;" placeholder="Describe your validation findings..."></textarea>
                </div>

                <div id="modal-status"></div>

                <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn" id="submit-btn">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8100';
        let currentUser = null;
        let mySubmissions = [];

        function debugLog(message) {
            const output = document.getElementById('debug-output');
            const timestamp = new Date().toLocaleTimeString();
            output.textContent = `[${timestamp}] ${message}\n\n` + output.textContent;
            console.log(message);
        }

        function clearDebug() {
            document.getElementById('debug-output').textContent = 'Output cleared.';
        }

        function getCurrentUser() {
            const userData = localStorage.getItem('obius_user');
            if (userData) {
                try {
                    return JSON.parse(userData);
                } catch (e) {
                    return null;
                }
            }
            return null;
        }

        function debugAuth() {
            debugLog('=== AUTH CHECK ===');
            currentUser = getCurrentUser();
            
            if (!currentUser) {
                debugLog('❌ No user found');
                return;
            }
            
            debugLog('✅ User: ' + currentUser.name);
            debugLog('Roles: ' + JSON.stringify(currentUser.roles));
            debugLog('API Key: ' + currentUser.api_key.substring(0, 10) + '...');
            debugLog('Has validator role: ' + currentUser.roles.includes('validator'));
        }

        async function testAPI() {
            debugLog('=== API TEST ===');
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                debugLog('✅ API responding: ' + JSON.stringify(data));
            } catch (error) {
                debugLog('❌ API error: ' + error.message);
            }
        }

        async function testValidatorEndpoint() {
            debugLog('=== TESTING /validators/me ===');
            
            if (!currentUser) {
                debugLog('❌ No user logged in');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/validators/me`, {
                    headers: { 'X-API-Key': currentUser.api_key }
                });
                
                debugLog('Status: ' + response.status);
                const data = await response.json();
                
                if (response.ok) {
                    debugLog('✅ Endpoint working!\n' + JSON.stringify(data, null, 2));
                } else {
                    debugLog('❌ Error: ' + JSON.stringify(data));
                }
            } catch (error) {
                debugLog('❌ Request failed: ' + error.message);
            }
        }

        async function testTasksEndpoint() {
            debugLog('=== TESTING /validation-tasks ===');
            
            if (!currentUser) {
                debugLog('❌ No user logged in');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/validation-tasks`, {
                    headers: { 'X-API-Key': currentUser.api_key }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    debugLog(`✅ Found ${data.length} tasks`);
                    if (data.length > 0) {
                        debugLog('First task:\n' + JSON.stringify(data[0], null, 2));
                    }
                } else {
                    debugLog('❌ Error: ' + JSON.stringify(data));
                }
            } catch (error) {
                debugLog('❌ Failed: ' + error.message);
            }
        }

        async function initializeValidator() {
            debugLog('=== INITIALIZING VALIDATOR ===');
            
            if (!currentUser) {
                debugLog('❌ Please sign in first');
                return;
            }
            
            if (!currentUser.roles.includes('validator')) {
                debugLog('❌ User does not have validator role. Please register with validator role at /auth.html');
                return;
            }
            
            debugLog('Running initialization checks...');
            await testAPI();
            await testValidatorEndpoint();
            await testTasksEndpoint();
            debugLog('=== INITIALIZATION COMPLETE ===');
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(`${tabName}-tab`).classList.add('active');

            if (tabName === 'history') {
                loadValidationHistory();
            }
        }

        async function loadValidatorStats() {
            try {
                const response = await fetch(`${API_BASE}/validators/me`, {
                    headers: { 'X-API-Key': currentUser.api_key }
                });

                if (response.ok) {
                    const stats = await response.json();
                    document.getElementById('total-validations').textContent = stats.stats?.total_validations || 0;
                    document.getElementById('consensus-rate').textContent = `${((stats.stats?.consensus_rate || 0) * 100).toFixed(0)}%`;
                    document.getElementById('total-earned').textContent = `$${(stats.stats?.total_earned || 0).toFixed(2)}`;
                    document.getElementById('current-balance').textContent = `$${(stats.balance || 0).toFixed(2)}`;
                }
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        async function loadAvailableTasks() {
            const container = document.getElementById('tasks-container');
            
            try {
                const response = await fetch(`${API_BASE}/validation-tasks`, {
                    headers: { 'X-API-Key': currentUser.api_key }
                });

                if (response.ok) {
                    const tasks = await response.json();
                    // Store submitted task IDs locally
                    const submittedTaskIds = mySubmissions.map(s => s.task_id);
                    // Filter out tasks already submitted
                    const availableTasks = tasks.filter(task => !submittedTaskIds.includes(task.task_id));
                    displayTasks(availableTasks);
                } else {
                    container.innerHTML = '<div class="empty-state"><h3>Failed to load tasks</h3></div>';
                }
            } catch (error) {
                container.innerHTML = '<div class="empty-state"><h3>Connection error</h3></div>';
            }
        }

        function displayTasks(tasks) {
            const container = document.getElementById('tasks-container');

            if (tasks.length === 0) {
                container.innerHTML = '<div class="empty-state"><h3>No tasks available</h3><p>Check back later or you\'ve completed all available tasks!</p></div>';
                return;
            }

            container.innerHTML = tasks.map(task => `
                <div class="task-card">
                    <div class="task-header">
                        <div>
                            <div class="task-title">${task.package_name}</div>
                            <div class="task-meta">${task.validation_type.replace(/_/g, ' ')} • ${task.spots_remaining} spot(s) remaining</div>
                        </div>
                        <div class="reward-badge">+$${task.reward_pool.toFixed(3)}</div>
                    </div>
                    <button class="btn" onclick="startValidation(${task.task_id}, '${task.package_name}', '${task.validation_type}')">
                        Start Validation
                    </button>
                </div>
            `).join('');
        }

        async function loadValidationHistory() {
            const container = document.getElementById('history-container');
            container.innerHTML = '<div class="loading">Loading history...</div>';

            try {
                const response = await fetch(`${API_BASE}/validators/me/history`, {
                    headers: { 'X-API-Key': currentUser.api_key }
                });

                if (response.ok) {
                    const history = await response.json();
                    
                    if (history.length === 0) {
                        container.innerHTML = '<div class="empty-state"><h3>No validation history yet</h3><p>Complete validation tasks to see your history here</p></div>';
                        return;
                    }

                    // Store in local array and also update submitted task IDs
                    mySubmissions = history;
                    
                    container.innerHTML = history.map(sub => `
                        <div class="history-item">
                            <div class="history-header">
                                <div>
                                    <div style="font-weight: 600; margin-bottom: 0.25rem;">${sub.package_name}</div>
                                    <div style="font-size: 0.875rem; color: var(--text-secondary);">${sub.validation_type.replace(/_/g, ' ')} • ${sub.category}</div>
                                </div>
                                <span class="status-badge ${sub.passed ? 'pass' : 'fail'}">
                                    ${sub.passed ? '✓ Passed' : '✗ Failed'}
                                </span>
                            </div>
                            <div style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 0.5rem;">
                                Confidence: ${(sub.confidence_score * 100).toFixed(0)}% • Earned: ${sub.payout_earned.toFixed(3)}
                            </div>
                            <div style="background: white; padding: 0.75rem; border-radius: 4px; font-size: 0.875rem;">
                                ${sub.notes}
                            </div>
                            <div style="margin-top: 0.75rem; font-size: 0.75rem; color: var(--text-secondary);">
                                Submitted: ${new Date(sub.submitted_at).toLocaleString()}
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div class="empty-state"><h3>Failed to load history</h3></div>';
                }
            } catch (error) {
                console.error('Failed to load history:', error);
                container.innerHTML = '<div class="empty-state"><h3>Error loading history</h3></div>';
            }
        }

        function startValidation(taskId, packageName, validationType) {
            console.log('Opening validation modal for task:', taskId);
            
            // Clear previous form data completely
            document.getElementById('validation-form').reset();
            document.getElementById('modal-status').innerHTML = '';
            
            // Set new task data
            document.getElementById('task-id').value = taskId;
            document.getElementById('modal-package-name').textContent = packageName;
            document.getElementById('modal-validation-type').textContent = validationType.replace(/_/g, ' ');
            
            // Reset confidence display
            document.getElementById('confidence-score').value = 80;
            document.getElementById('confidence-display').textContent = '80%';
            
            // Show modal
            document.getElementById('validation-modal').classList.add('show');
            
            console.log('Modal opened with task_id:', taskId);
        }

        function closeModal() {
            document.getElementById('validation-modal').classList.remove('show');
            document.getElementById('validation-form').reset();
            document.getElementById('modal-status').innerHTML = '';
            document.getElementById('task-id').value = '';
        }

        document.getElementById('confidence-score').addEventListener('input', (e) => {
            document.getElementById('confidence-display').textContent = e.target.value + '%';
        });

        document.getElementById('validation-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const taskId = parseInt(document.getElementById('task-id').value);
            console.log('Submitting validation for task_id:', taskId);

            if (!taskId) {
                document.getElementById('modal-status').innerHTML = 
                    '<div class="status-message status-error">Error: No task ID found. Please close and try again.</div>';
                return;
            }

            const payload = {
                passed: document.getElementById('validation-result').value === 'pass',
                confidence_score: parseFloat(document.getElementById('confidence-score').value) / 100,
                notes: document.getElementById('validation-notes').value,
                validation_data: {}
            };

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            try {
                const response = await fetch(`${API_BASE}/validation-tasks/${taskId}/submit`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': currentUser.api_key
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                console.log('Submission response:', data);

                if (response.ok) {
                    // Reload history from database to get accurate payout info
                    try {
                        const historyResponse = await fetch(`${API_BASE}/validators/me/history`, {
                            headers: { 'X-API-Key': currentUser.api_key }
                        });
                        if (historyResponse.ok) {
                            mySubmissions = await historyResponse.json();
                        }
                    } catch (e) {
                        console.error('Failed to reload history:', e);
                    }

                    document.getElementById('modal-status').innerHTML = 
                        '<div class="status-message status-success">✓ Validation submitted successfully!</div>';
                    
                    setTimeout(() => {
                        closeModal();
                        loadAvailableTasks();
                        loadValidatorStats();
                    }, 2000);
                } else {
                    document.getElementById('modal-status').innerHTML = 
                        `<div class="status-message status-error">Error: ${data.detail || 'Submission failed'}</div>`;
                }
            } catch (error) {
                console.error('Submission error:', error);
                document.getElementById('modal-status').innerHTML = 
                    '<div class="status-message status-error">Network error. Please try again.</div>';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit';
            }
        });

        async function init() {
            currentUser = getCurrentUser();
            
            if (!currentUser) {
                window.location.href = '/auth.html';
                return;
            }

            if (!currentUser.roles.includes('validator')) {
                alert('Validator role required');
                window.location.href = '/profile.html';
                return;
            }

            // Load history first to know which tasks we've submitted to
            try {
                const response = await fetch(`${API_BASE}/validators/me/history`, {
                    headers: { 'X-API-Key': currentUser.api_key }
                });
                if (response.ok) {
                    mySubmissions = await response.json();
                }
            } catch (error) {
                console.error('Failed to preload history:', error);
            }

            await loadValidatorStats();
            await loadAvailableTasks();
        }

        init();
    </script>
</body>
</html>
